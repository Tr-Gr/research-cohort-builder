# Promote the same code dev -> staging -> prod. Each environment runs against its own catalog and target.
#   push to main        -> deploy to staging, then run the setup job (idempotent)
#   manual (workflow_dispatch) with target=prod -> deploy to prod; protect the "prod" environment with required reviewers
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Target to deploy
        required: true
        default: prod
        type: choice
        options: [staging, prod]

jobs:
  deploy:
    # Skip until the repo is configured (set the DATABRICKS_HOST variable on the environment or repo).
    if: ${{ vars.DATABRICKS_HOST != '' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_service_principal_application_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Validate
        run: databricks bundle validate -t "$TARGET"
      - name: Deploy
        run: databricks bundle deploy -t "$TARGET"
      - name: Set up schema, volume and policies (safe to re-run)
        run: databricks bundle run -t "$TARGET" research_setup

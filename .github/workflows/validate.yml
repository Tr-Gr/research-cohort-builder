# Validate the bundle on every pull request. Nothing is deployed.
name: validate
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    # Skip until the repo is configured (set the DATABRICKS_HOST variable on the environment or repo).
    if: ${{ vars.DATABRICKS_HOST != '' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      BUNDLE_VAR_service_principal_application_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Python syntax check
        run: python -m py_compile src/*.py scripts/*.py
      - name: Validate bundle (staging)
        run: databricks bundle validate -t staging
